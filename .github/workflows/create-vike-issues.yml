# .github/workflows/create-vike-issues.yml
# ------------------------------------------------------------------------------
# V.I.K.e / Guardian Circle – Bootstrap GitHub Issues
# ------------------------------------------------------------------------------
# Manually trigger this workflow to create all implementation issues,
# labels, and milestones defined in the Developer Checklist.
#
# Safety: workflow_dispatch only (never runs on push/PR).
# Requires: contents: write + issues: write permissions.
# ------------------------------------------------------------------------------

name: Create V.I.K.e Implementation Issues

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "CREATE" to confirm issue creation'
        required: true
        type: string
      dry_run:
        description: 'Dry run (print actions only, do not create).'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  create-issues:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'CREATE' }}

    steps:
      - name: Checkout (for reference only)
        uses: actions/checkout@v4

      - name: Create labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail

          labels=(
            "type: feature|#1D76DB"
            "type: enhancement|#A2EEEF"
            "type: bug|#D73A4A"
            "area: screening|#5319E7"
            "area: file|#0E8A16"
            "area: circle|#FBCA04"
            "area: trust|#B60205"
            "area: a11y|#D93F0B"
            "area: privacy|#006B75"
            "area: global|#C5DEF5"
            "priority: P0|#B60205"
            "priority: P1|#FBCA04"
            "priority: P2|#0E8A16"
            "status: ready|#C2E0C6"
          )

          for entry in "${labels[@]}"; do
            name="${entry%%|*}"
            color="${entry##*|}"
            color="${color#\#}"   # strip leading #

            if [[ "$DRY_RUN" == "true" ]]; then
              echo "[DRY RUN] Would ensure label: $name ($color)"
              continue
            fi

            # Create or update label (ignore error if it already exists)
            gh label create "$name" --color "$color" --force || true
            echo "Label ready: $name"
          done

      - name: Create milestones
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail

          milestones=(
            "M1 – Core Screening"
            "M2 – File & Local Storage"
            "M3 – Circle & Handoffs"
            "M4 – Trust Center & Founding"
            "M5 – Polish, A11y & Edge Cases"
          )

          for title in "${milestones[@]}"; do
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "[DRY RUN] Would ensure milestone: $title"
              continue
            fi

            # Create only if it does not already exist
            existing=$(gh api "repos/{owner}/{repo}/milestones" --jq ".[] | select(.title==\"$title\") | .number" || true)
            if [[ -z "$existing" ]]; then
              gh api "repos/{owner}/{repo}/milestones" -f title="$title" -f state=open
              echo "Created milestone: $title"
            else
              echo "Milestone already exists: $title (#$existing)"
            fi
          done

      - name: Create issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail

          # Helper: create one issue
          create_issue() {
            local title="$1"
            local body="$2"
            local labels="$3"        # comma-separated
            local milestone="$4"

            if [[ "$DRY_RUN" == "true" ]]; then
              echo "[DRY RUN] Would create issue:"
              echo "  Title: $title"
              echo "  Milestone: $milestone"
              echo "  Labels: $labels"
              echo "  Body (first 120 chars): ${body:0:120}..."
              echo "---"
              return
            fi

            # Resolve milestone number
            ms_number=$(gh api "repos/{owner}/{repo}/milestones" --jq ".[] | select(.title==\"$milestone\") | .number")
            if [[ -z "$ms_number" ]]; then
              echo "ERROR: Milestone not found: $milestone"
              exit 1
            fi

            # Build label args
            label_args=()
            IFS=',' read -ra LABEL_ARRAY <<< "$labels"
            for l in "${LABEL_ARRAY[@]}"; do
              label_args+=(--label "$l")
            done

            gh issue create \
              --title "$title" \
              --body "$body" \
              --milestone "$milestone" \
              "${label_args[@]}"

            echo "Created: $title"
          }

          # ------------------------------------------------------------------
          # M1 – Core Screening
          # ------------------------------------------------------------------

          create_issue \
            "Implement global interaction principles (calm UI, user agency, progressive disclosure)" \
            "$(cat <<'BODY'
## Summary
Establish the foundational interaction rules that apply across the entire app.

## Acceptance Criteria
- [ ] No red badges, pulsing indicators, or forced urgency anywhere in the UI
- [ ] AI never auto-sends, auto-saves, or intervenes without explicit user action
- [ ] Every consequential action requires a clear user choice
- [ ] Progressive disclosure: essential information first; detail is user-initiated
- [ ] Every tap shows visible pressed state within 100ms
- [ ] Long-running operations show clear non-blocking progress
- [ ] Destructive actions require explicit confirmation
- [ ] Any data leaving the device surfaces a brief plain-English reminder
- [ ] Undo available for Save-to-File (minimum 5 seconds)

## Notes
These are non-negotiable product principles. Reference Interaction Specs slides 2 & 9.
BODY
)" \
            "type: feature, area: global, priority: P0, status: ready" \
            "M1 – Core Screening"

          create_issue \
            "Build Home / Vicky screen with calm default state and primary CTA" \
            "$(cat <<'BODY'
## Summary
Implement the primary landing screen for V.I.K.e.

## Acceptance Criteria
- [ ] Calm default state with “I’m here. Ready to listen.”
- [ ] Primary CTA “Hey Vicky” is large, high-contrast, and calm
- [ ] Pressed state on CTA (scale + opacity)
- [ ] Light haptic on supported devices when CTA is tapped
- [ ] No notification badges or red alerts on home
- [ ] Secondary access to demo samples and Trust Center is available but non-prominent
- [ ] First-run vs returning user states handled cleanly

## Design Reference
App Design deck – Screen 01 (Home)
BODY
)" \
            "type: feature,area: screening,priority: P0,status: ready" \
            "M1 – Core Screening"

          create_issue \
            "Implement screening input sheet (Paste / Dictate / Demo)" \
            "$(cat <<'BODY'
## Summary
Build the input experience that appears after tapping “Hey Vicky”.

## Acceptance Criteria
- [ ] Bottom sheet or full-screen input appears after “Hey Vicky”
- [ ] Three clear options: Paste · Dictate · Demo samples
- [ ] Paste field is large multiline with neutral placeholder
- [ ] Character count (if shown) is non-judgmental
- [ ] Dictate mode shows live waveform / recording state
- [ ] Transcription appears for user review before submit
- [ ] Demo samples are clearly labeled “Fictional demo data”
- [ ] Selecting a demo loads text into the field with visible “Demo” badge
- [ ] “Analyze” button is disabled when field is empty
- [ ] “Analyze” enables only when content is present

## Design Reference
Interaction Specs – Flow 01A
BODY
)" \
            "type: feature,area: screening,priority: P0,status: ready" \
            "M1 – Core Screening"

          create_issue \
            "Implement analysis submit, processing, timeout, and error states" \
            "$(cat <<'BODY'
## Summary
Handle the transition from input submission through analysis completion or failure.

## Acceptance Criteria
- [ ] Tap “Analyze” locks the input field
- [ ] Button shows spinner + “Analyzing…”
- [ ] Cancel available only for the first ~1.5 seconds
- [ ] Calm progress indicator (no percentage required)
- [ ] Soft status copy: “Reading patterns…”
- [ ] Timeout handling after ~20s with options: Keep waiting · Cancel
- [ ] On cancel or failure, original text remains on device and is not lost
- [ ] Network failure shows clear message that text stayed on device + Retry

## Design Reference
Interaction Specs – Flow 01B + Edge States
BODY
)" \
            "type: feature,area: screening,priority: P0,status: ready" \
            "M1 – Core Screening"

          create_issue \
            "Build five-line pattern result view with expand/collapse" \
            "$(cat <<'BODY'
## Summary
Display the core analysis output: five pattern lines with progressive disclosure.

## Acceptance Criteria
- [ ] Five pattern lines appear (staggered fade-in ~120ms optional)
- [ ] Each line shows: Name → Markers (with actual words) → What it tends to mean → One concrete action
- [ ] Language is descriptive only — no diagnostic labels, no mind-reading claims
- [ ] Lines are collapsed by default
- [ ] Tap expands a line; second tap or explicit control collapses it
- [ ] User can scroll immediately while content is still appearing
- [ ] Persistent footer: “I read words and patterns only.”

## Design Reference
App Design – Screen 02 (Analysis) + Interaction Specs Flow 01B
BODY
)" \
            "type: feature,area: screening,priority: P0,status: ready" \
            "M1 – Core Screening"

          create_issue \
            "Implement optional reply drafts section" \
            "$(cat <<'BODY'
## Summary
Add the collapsed-by-default drafts section that appears after analysis.

## Acceptance Criteria
- [ ] “What I would say” section is collapsed by default
- [ ] Expanding requires explicit user tap
- [ ] Each draft has a Copy action only (no Send)
- [ ] Copy provides clear success feedback
- [ ] Drafts only appear after a successful analysis

## Notes
User remains the agent — never auto-send.
BODY
)" \
            "type: feature,area: screening,priority: P0,status: ready" \
            "M1 – Core Screening"

          create_issue \
            "Implement Save to File with local-only storage and undo" \
            "$(cat <<'BODY'
## Summary
Allow users to save an analysis result to the local evidence file.

## Acceptance Criteria
- [ ] Quiet secondary action (not competing with primary content)
- [ ] On save: confirmation toast “Saved to your device only”
- [ ] Undo available for at least 5 seconds
- [ ] Save writes exclusively to local/device storage
- [ ] No server involvement

## Design Reference
Interaction Specs – Flow 01B + Privacy requirements
BODY
)" \
            "type: feature,area: screening,area: privacy,priority: P0,status: ready" \
            "M1 – Core Screening"

          # ------------------------------------------------------------------
          # M2 – File & Local Storage
          # ------------------------------------------------------------------

          create_issue \
            "Build local-only File list (chronological evidence log)" \
            "$(cat <<'BODY'
## Summary
Implement the personal evidence log that lives only on device.

## Acceptance Criteria
- [ ] Chronological list, newest first
- [ ] Each row shows: date · short label · “5 pattern lines” (or equivalent)
- [ ] Swipe-left reveals Delete (File list only)
- [ ] Opening an entry loads the full analysis result from local storage
- [ ] Visual “Saved” indicator present on historical entries
- [ ] Empty state is calm and clear
- [ ] No server round-trip for any File read operation

## Design Reference
App Design – Screen 03 (File)
BODY
)" \
            "type: feature,area: file,area: privacy,priority: P0,status: ready" \
            "M2 – File & Local Storage"

          create_issue \
            "Implement single and bulk export to plain text" \
            "$(cat <<'BODY'
## Summary
Allow users to export their local evidence as clean plain text via the system share sheet.

## Acceptance Criteria
- [ ] Export single → generates clean plain-text → opens system share sheet
- [ ] Export all → confirmation dialog → progress if needed → share sheet
- [ ] Export contains only user-visible content (no internal IDs or metadata that could leak)
- [ ] No automatic cloud upload
BODY
)" \
            "type: feature,area: file,priority: P0,status: ready" \
            "M2 – File & Local Storage"

          create_issue \
            "Implement hard delete for single entries and full wipe" \
            "$(cat <<'BODY'
## Summary
Provide destructive actions that are hard deletes on device only.

## Acceptance Criteria
- [ ] Delete single → confirmation: “Delete this entry? It cannot be recovered.”
- [ ] Delete all → requires strong confirmation (typed “DELETE” or biometric)
- [ ] After Delete all, empty state is calm and clear
- [ ] Delete is hard delete on device — nothing remains on any server
- [ ] Storage-full state shows clear guidance (export or delete older entries)
BODY
)" \
            "type: feature,area: file,area: privacy,priority: P0,status: ready" \
            "M2 – File & Local Storage"

          # ------------------------------------------------------------------
          # M3 – Circle & Handoffs
          # ------------------------------------------------------------------

          create_issue \
            "Build Circle tab with four guardian cards and status" \
            "$(cat <<'BODY'
## Summary
Create the overview of all guardians.

## Acceptance Criteria
- [ ] Four guardian cards with clear status: Live / Beta / Coming
- [ ] Tapping an available guardian opens it
- [ ] Tapping a Coming guardian shows short description + optional “Notify me” (local preference only)
- [ ] Clear visual hierarchy between Live / Beta / Coming

## Design Reference
App Design – Screen 04 (Circle)
BODY
)" \
            "type: feature,area: circle,priority: P1,status: ready" \
            "M3 – Circle & Handoffs"

          create_issue \
            "Implement soft, dismissible guardian handoff prompts" \
            "$(cat <<'BODY'
## Summary
Allow contextual suggestions to move between guardians without auto-routing.

## Acceptance Criteria
- [ ] Contextual handoff prompts appear only after relevant analyses
- [ ] Prompts are dismissible
- [ ] Handoff prompts never auto-route the user
- [ ] Accepting a handoff requires explicit user confirmation of what context is shared
- [ ] Clear “Back to Vicky” / “Back to Circle” navigation from every guardian
- [ ] No silent background routing between guardians
BODY
)" \
            "type: feature,area: circle,priority: P1,status: ready" \
            "M3 – Circle & Handoffs"

          # ------------------------------------------------------------------
          # M4 – Trust Center & Founding
          # ------------------------------------------------------------------

          create_issue \
            "Build Trust Center with plain-English privacy sections" \
            "$(cat <<'BODY'
## Summary
Create the always-reachable Trust Center that matches actual architecture.

## Acceptance Criteria
- [ ] Reachable in one tap from: You tab, analysis footer, and privacy-related moments
- [ ] Six core sections present and accurate:
  - What you paste
  - Your evidence file
  - Delete means delete
  - AI disclosure
  - V2 north star
  - Founding status / invite tools
- [ ] Content is plain-English and current
- [ ] “Updated [date]” indicator when architecture or policy changes
- [ ] No pre-checked boxes or dark patterns
- [ ] Privacy copy matches actual implementation (critical)

## Design Reference
App Design – Screen 05 (Trust) + Interaction Specs Flow 04
BODY
)" \
            "type: feature,area: trust,area: privacy,priority: P0,status: ready" \
            "M4 – Trust Center & Founding"

          create_issue \
            "Implement Founding status, invite code, and nomination flow" \
            "$(cat <<'BODY'
## Summary
Support the Founding Circle membership experience inside the app.

## Acceptance Criteria
- [ ] Founding invite code can be viewed and copied
- [ ] Nomination flow works and feels private
- [ ] Rate-lock status is visible to Founding members
- [ ] All actions feel intentional and non-viral
BODY
)" \
            "type: feature,area: trust,priority: P0,status: ready" \
            "M4 – Trust Center & Founding"

          # ------------------------------------------------------------------
          # M5 – Polish, A11y & Edge Cases
          # ------------------------------------------------------------------

          create_issue \
            "Meet accessibility requirements (VoiceOver, TalkBack, Dynamic Type, contrast, Reduce Motion)" \
            "$(cat <<'BODY'
## Summary
Ensure the app is usable by people relying on assistive technologies and system accessibility settings.

## Acceptance Criteria
- [ ] Full VoiceOver (iOS) and TalkBack (Android) support
- [ ] All interactive elements have proper accessibility labels
- [ ] Analysis results are read in logical order
- [ ] Dynamic Type / font scaling to 200% without truncation or overlap
- [ ] Body text meets WCAG AA contrast; critical actions aim for AAA
- [ ] System high-contrast mode is respected
- [ ] Reduce Motion is respected (essential state changes remain clear)
- [ ] Primary actions have touch targets ≥ 44pt
- [ ] No core flow requires precision-only gestures
- [ ] Language remains plain; no time pressure on the user
- [ ] Destructive actions always require confirmation

## Notes
This is a launch blocker.
BODY
)" \
            "type: feature,area: a11y,priority: P0,status: ready" \
            "M5 – Polish, A11y & Edge Cases"

          create_issue \
            "Implement all defined edge and error states" \
            "$(cat <<'BODY'
## Summary
Cover the non-happy paths defined in the Interaction Specs.

## Acceptance Criteria
- [ ] Empty paste → Analyze remains disabled + gentle helper text
- [ ] Network failure → clear message that text stayed on device + Retry
- [ ] Very long input → soft warning, still allows submit
- [ ] Analysis timeout → “This is taking longer than usual” + Keep waiting / Cancel
- [ ] Local storage full → actionable message on save attempt
- [ ] Unsupported browser / missing APIs → graceful degradation message
- [ ] Offline state is detectable and communicated calmly
BODY
)" \
            "type: feature,area: global,priority: P1,status: ready" \
            "M5 – Polish, A11y & Edge Cases"

          create_issue \
            "Implement standard gestures, haptics, and transitions" \
            "$(cat <<'BODY'
## Summary
Polish the tactile and motion language of the app.

## Acceptance Criteria
- [ ] Tap: pressed state (≈4% scale + opacity)
- [ ] Long-press: used only for quick actions on File entries and drafts
- [ ] Swipe-left: File list only, reveals Delete, requires confirmation
- [ ] No pull-to-refresh on Analysis or File screens
- [ ] Haptics: light impact on primary actions, success on save, warning on destructive confirm
- [ ] Transitions: 220–280ms, ease-out, shared-element where appropriate
- [ ] Respects system “Reduce Motion” setting
BODY
)" \
            "type: enhancement,area: global,priority: P1,status: ready" \
            "M5 – Polish, A11y & Edge Cases"

          create_issue \
            "Verify privacy claims match implementation" \
            "$(cat <<'BODY'
## Summary
Confirm that every privacy statement shown to users is technically accurate.

## Acceptance Criteria
- [ ] Evidence file stored only in local/device storage (never sent to server)
- [ ] Analysis requests are ephemeral (no content logging, no training)
- [ ] No analytics that capture message content
- [ ] Demo mode clearly distinguished from live analysis
- [ ] Export produces human-readable plain text only
- [ ] Delete is hard delete on device
- [ ] Privacy copy in Trust Center matches actual data flow
- [ ] Manual test: confirm no message content appears in network logs or server storage

## Notes
Launch blocker. Treat as security/privacy review item.
BODY
)" \
            "type: feature,area: privacy,priority: P0,status: ready" \
            "M5 – Polish, A11y & Edge Cases"

          create_issue \
            "Final release gate – do not ship until complete" \
            "$(cat <<'BODY'
## Summary
Final verification before any production release.

## Acceptance Criteria
- [ ] All P0 issues closed
- [ ] Privacy architecture claims in the UI match the actual data flow
- [ ] Accessibility audit passed on target platforms
- [ ] No console errors or unhandled promise rejections in core flows
- [ ] File save/load/delete works under device storage restrictions
- [ ] Network failure and timeout paths manually tested
- [ ] Founding Circle invite and nomination flows tested end-to-end
- [ ] State inventory (see Developer Checklist §12) fully covered

## Notes
This issue is the final gate. Do not close until every item is verified.
BODY
)" \
            "type: feature,priority: P0,status: ready" \
            "M5 – Polish, A11y & Edge Cases"

          echo ""
          echo "----------------------------------------"
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "DRY RUN complete – no issues were created."
          else
            echo "All issues created successfully."
          fi
          echo "----------------------------------------"
